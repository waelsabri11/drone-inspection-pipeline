[project]
name = "gnn-drone-inspection"
version = "0.1.0"
description = "Learning to rank drone inspection waypoints with a GNN (PyTorch Geometric), compared with centrality baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torch_geometric>=2.5",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gnn-inspect = "gnn_inspect.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnn_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
