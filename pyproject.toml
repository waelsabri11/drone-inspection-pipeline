[project]
name = "gnn-drone-inspection"
version = "0.1.0"
description = "Drone inspection pipeline: crack detection (CNN vs ViT), compression, graph prioritisation (GNN/centralities) and OR-Tools routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torch_geometric>=2.5",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "torchvision",
    "timm>=1.0",
    "onnx",
    "onnxruntime>=1.18",
    "ortools>=9.10",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gnn-inspect = "gnn_inspect.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnn_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
